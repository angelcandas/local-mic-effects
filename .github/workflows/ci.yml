# Builds MicFX and runs the headless tests on every pull request and push to main.
#
# Linux runs on every PR: it's the cheapest runner and catches compile errors and test
# failures in the shared code. macOS (the main platform, with the AU) runs on pushes to
# main and on demand (Actions tab -> CI -> Run workflow), since its runners cost more.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI scripts parse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every UI script for syntax errors
        run: for f in ui/*.js; do node --check "$f"; done
      - name: Check every UI file is embedded in the app (release builds serve only those)
        run: |
          missing=0
          for f in ui/*.js ui/*.css ui/*.html; do grep -q "^ *$f\$" CMakeLists.txt || { echo "::error::$f is not in juce_add_binary_data (CMakeLists.txt)"; missing=1; }; done
          exit $missing

  linux:
    name: Linux build + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Downloaded packages are cached between runs, so most runs fetch only the package
      # lists. apt gets short network timeouts and retries, and a try that hangs is
      # stopped and retried over https after the first.
      - name: Restore apt package cache
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-linux-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-linux-

      - name: Install build dependencies
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-cache/partial
          opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Dir::Cache::Archives=$HOME/apt-cache"
          packages="ninja-build ccache \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxi-dev libxcomposite-dev \
            libxrender-dev libfreetype-dev libfontconfig1-dev libasound2-dev libx11-dev libgl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              # The runners read Ubuntu's mirrors from a mirror list that points at their
              # own Azure mirror over plain http. When that stops answering (as on
              # 2026-11-11, when plain-http Ubuntu mirrors were all unreachable from the
              # runners), retry over https: the same mirror, then kernel.org's.
              if [ "$attempt" -eq 2 ]; then mirror=https://azure.archive.ubuntu.com/ubuntu; else mirror=https://mirrors.edge.kernel.org/ubuntu; fi
              echo "::warning::apt try $((attempt - 1)) failed or hung; retrying on $mirror"
              printf '%s\n' \
                'Types: deb' "URIs: $mirror" 'Suites: noble noble-updates noble-backports noble-security' \
                'Components: main restricted universe multiverse' 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
                | sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null
              sudo rm -f /etc/apt/sources.list
            fi
            if sudo timeout 120 apt-get $opts update && sudo timeout 300 apt-get $opts install -y $packages; then
              sudo chown -R "$USER" ~/apt-cache
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: cmake --preset debug -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build the tests, the standalone app, the VST3 and the instrument plugins
        run: cmake --build build/debug --target MicFXTests MicFX_Standalone MicFX_VST3 MicFXInstruments

      - name: Run the tests
        run: ./build/debug/MicFXTests_artefacts/Debug/MicFXTests

  macos:
    name: macOS build + tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset debug

      - name: Build the tests, the app and the plugins
        run: cmake --build build/debug --target MicFXTests MicFX_Standalone MicFX_VST3 MicFX_AU MicFXInstruments

      - name: Run the tests
        run: ./build/debug/MicFXTests_artefacts/Debug/MicFXTests
