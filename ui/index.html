<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MicFX</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Shared gradient for the logo and the level knobs -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <linearGradient id="arc-gradient" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#8c7bff" />
        <stop offset="1" stop-color="#3fd9c6" />
      </linearGradient>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="url(#arc-gradient)" />
        <path d="M7 16h2.5l2-6 3 12 3-15 3 13 2-4H25" fill="none" stroke="#0c0e13" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div>
        <h1>MicFX</h1>
        <p>Live voice processor</p>
      </div>
    </div>

    <div class="preset-bar">
      <button class="icon-button" data-preset-step="-1" aria-label="Previous preset">‹</button>
      <button class="preset-button" aria-haspopup="true" aria-expanded="false">
        <span class="preset-label">Preset</span>
        <span class="preset-name">—</span>
        <span class="preset-modified" title="Changed since the preset was loaded">•</span>
        <span class="chevron">▾</span>
      </button>
      <button class="icon-button" data-preset-step="1" aria-label="Next preset">›</button>
      <div class="preset-menu" hidden></div>
    </div>

    <div class="chips">
      <span class="chip chip--live"><span class="dot"></span>Live</span>
      <span class="chip">Headphones recommended</span>
    </div>
  </header>

  <div class="workspace">
    <nav class="sidebar" aria-label="Effects">
      <div class="sidebar-header">
        <h2>Effects</h2>
        <span class="active-count"></span>
      </div>
      <div class="sidebar-groups"></div>
    </nav>

    <main class="chain" aria-label="Active effects">
      <div class="chain-grid"></div>
      <div class="chain-empty" hidden>
        <p class="big">Your chain is empty</p>
        <p>Switch on effects from the list, or pick a preset above.</p>
      </div>
    </main>

    <aside class="levels" aria-label="Levels">
      <section class="level">
        <h2>Input</h2>
        <div class="knob" data-param="inputGain" data-label="Gain" data-bipolar></div>
        <div class="meter" data-meter="input"></div>
      </section>
      <section class="level">
        <h2>Output</h2>
        <div class="knob" data-param="outputGain" data-label="Gain" data-bipolar></div>
        <div class="meter" data-meter="output"></div>
        <p class="limiter-note">Limited at −1 dB</p>
      </section>
    </aside>
  </div>

  <footer class="recorder studio" aria-label="Tracks and recorder">
    <div class="transport">
      <button class="transport-button" data-transport="stop" title="Back to the start" aria-label="Back to the start">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="2" height="10" rx="0.5" /><path d="M13 3.5v9a.5.5 0 0 1-.8.4L6.3 8.4a.5.5 0 0 1 0-.8l5.9-4.5a.5.5 0 0 1 .8.4z" /></svg>
      </button>
      <button class="transport-button play-button" data-transport="play" title="Play / pause (Space)" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.8v10.4a.6.6 0 0 0 .9.5l8.2-5.2a.6.6 0 0 0 0-1L4.9 2.3a.6.6 0 0 0-.9.5z" /></svg>
        <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.5" width="3" height="11" rx="0.8" /><rect x="9.5" y="2.5" width="3" height="11" rx="0.8" /></svg>
      </button>
      <button class="record-button" aria-pressed="false" title="Record your voice on a new track while the music plays (R)">
        <span class="record-dot"></span><span class="record-label">Record</span>
      </button>
      <span class="record-time" aria-live="off">0:00.0</span>
      <span class="transport-length"></span>
      <button class="add-track" title="Load a song to sing along to (WAV, AIFF, FLAC, Ogg, MP3)">+ Backing track</button>
      <button class="pill record-dry" aria-pressed="false" title="Also save the unprocessed mic to a second file">
        <span class="switch"></span><span>Save dry mic</span>
      </button>
      <div class="record-folder">
        <span class="record-caption">Saving to</span>
        <span class="record-path" title=""></span>
        <button class="text-button record-change">Change…</button>
      </div>
      <div class="record-status" aria-live="polite"></div>
      <button class="icon-button tracks-toggle" aria-expanded="true" title="Show or hide the tracks" aria-label="Show or hide the tracks">▾</button>
    </div>
    <div class="tracks">
      <div class="tracks-rows"></div>
      <div class="tracks-empty">
        Load a <button class="text-button add-track-inline">backing track</button> to sing along. Every take you record lands on its own row below the music.
      </div>
      <div class="playhead" hidden></div>
    </div>
  </footer>
</body>
</html>
